<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forex Live — Economic Calendar</title>
<meta name="description" content="Live economic calendar with Forex Factory data. Real-time impact view of high-impact news events.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230b0e14'/%3E%3Ccircle cx='32' cy='32' r='14' fill='none' stroke='%2322d3ee' stroke-width='5'/%3E%3Ccircle cx='32' cy='32' r='5' fill='%2322d3ee'/%3E%3C/svg%3E">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="topbar">
  <div class="topbar-inner">
    <a class="brand" href="./">
      <span class="brand-mark">
        <svg viewBox="0 0 64 64" aria-hidden="true">
          <circle cx="32" cy="32" r="14" fill="none" stroke="currentColor" stroke-width="5"/>
          <circle cx="32" cy="32" r="5" fill="currentColor"/>
        </svg>
      </span>
      <span class="brand-text">
        <strong>Forex&nbsp;Live</strong>
        <em>Economic Calendar</em>
      </span>
    </a>

    <div class="clock" id="liveClock" title="Local time">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M12 7v5l3.2 2" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
      <span id="clockTime">--:--:--</span>
    </div>

    <div class="next-event" id="nextEvent" title="Next upcoming event" hidden>
      <span id="nextEventLabel"></span>
    </div>

    <div class="sync" id="syncStatus" data-state="loading">
      <span class="sync-dot"></span>
      <span id="syncLabel">Loading data…</span>
    </div>

    <button class="theme-toggle" id="themeToggle" type="button" aria-label="Toggle light / dark mode" title="Toggle light / dark mode (T)">
      <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.9 4.9l1.4 1.4m11.4 11.4l1.4 1.4M2 12h2m16 0h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8z"/></svg>
    </button>
  </div>
</header>

<nav class="toolbar" id="toolbar">
  <div class="toolbar-inner">

    <div class="tabs-row">
      <button class="today-btn" id="todayBtn" type="button" title="Jump to today (T)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="8"/><path d="M12 7v5l3 3"/></svg>
        <span>Today</span>
      </button>
      <div class="tabs" id="dayTabs" role="tablist" aria-label="Day filters"></div>
    </div>

    <div class="tools">
      <div class="filter-group" id="impactFilters" role="group" aria-label="Impact filters">
        <button class="chip is-on" data-impact="3" aria-pressed="true">High</button>
        <button class="chip is-on" data-impact="2" aria-pressed="true">Medium</button>
        <button class="chip is-on" data-impact="1" aria-pressed="true">Low</button>
        <button class="chip is-on" data-impact="0" aria-pressed="true">Holiday</button>
      </div>

      <div class="filter-group" id="currencyFilters" role="group" aria-label="Currency filters"></div>

      <div class="search" role="search">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2"/><path d="M16.5 16.5L21 21" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        <input id="searchInput" type="search" placeholder="Search events…" autocomplete="off" spellcheck="false">
      </div>
    </div>

  </div>
</nav>

<main class="content">
  <div id="statusBar" class="status-bar" hidden>
    <span id="statusText"></span>
    <button id="clearFilters" class="link-btn" type="button">Clear all</button>
  </div>
  <section id="calendar" aria-live="polite"></section>

  <section class="archive-section" aria-label="Announced news today">
    <div class="archive-title">
      <span class="arch-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="4" rx="1"/><path d="M5 8v10a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8"/><path d="M10 12h4"/></svg>
      </span>
      <h2>Announced Today</h2>
      <span class="archive-count" id="archiveCount">0</span>
    </div>
    <div class="events archive-table" id="archiveTable"></div>
  </section>
</main>

<footer class="footer">
  <p>Data: <a href="https://www.forexfactory.com/calendar" target="_blank" rel="noopener">Forex Factory</a> · updated <span id="dataAge">—</span></p>
  <p>Snapshot cached locally &amp; refreshed automatically every hour</p>
  <!-- Impact legend removed per request -->
  <p>Design By Brave Ramin (Ramin Moradli)</p>
</footer>

<script src="data/data-embedded.js"></script>
<script src="app.js"></script>
</body>
</html>
